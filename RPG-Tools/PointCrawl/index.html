<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crawl Cartographer - Mapa para D&D</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Bootstrap JS Bundle (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/themes/Brite/bootstrap.min.css">
</head>

<body>

    <!-- NAVBAR SUPERIOR -->
    <nav class="navbar navbar-dark bg-dark fixed-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-compass-fill"></i> Crawl Cartographer</a>
            <div class="d-flex">
                <button class="btn btn-secondary me-2" id="newNodeNavBtn"><i class="bi bi-plus-circle"></i> Nuevo
                    nodo</button>
                <button class="btn btn-secondary me-2" id="duplicateNodeNavBtn"><i class="bi bi-files"></i>
                    Duplicar</button>
                <button class="btn btn-danger me-2" id="resetNavBtn"><i class="bi bi-trash3"></i> Reset</button>
                <button class="btn btn-info me-2" data-bs-toggle="modal" data-bs-target="#exportModal"><i
                        class="bi bi-download"></i> Exportar</button>
                <button class="btn btn-success me-2" id="importJsonBtn"><i class="bi bi-upload"></i>
                    Importar</button>
                <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#settingsModal"><i
                        class="bi bi-gear"></i> Configuración</button>
            </div>
            <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
        </div>
    </nav>

    <!-- Modal de Exportación -->
    <div class="modal fade" id="exportModal" tabindex="-1" aria-labelledby="exportModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="exportModalLabel"><i class="bi bi-printer"></i> Exportar mapa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="modalSolidBgToggle" checked>
                        <label class="form-check-label" for="modalSolidBgToggle">Usar color de fondo del canvas
                            (desmarcar para transparente)</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="modalIncludeGridToggle" checked>
                        <label class="form-check-label" for="modalIncludeGridToggle">Incluir grilla en la
                            exportación</label>
                    </div>
                    <div class="d-grid gap-2">
                        <button id="modalExportPngBtn" class="btn btn-primary"><i class="bi bi-image"></i> Exportar como
                            PNG</button>
                        <button id="modalExportPdfBtn" class="btn btn-primary"><i class="bi bi-file-pdf"></i> Exportar
                            como PDF</button>
                        <button id="modalExportJsonBtn" class="btn btn-success"><i class="bi bi-filetype-json"></i>
                            Exportar como JSON</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de selección de iconos -->
    <div class="modal fade" id="iconPickerModal" tabindex="-1" aria-labelledby="iconPickerModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="iconPickerModalLabel"><i class="bi bi-images"></i> Seleccionar icono
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div id="iconPickerTags" class="px-3 pt-3"></div>
                <div class="modal-body icon-picker-body" style="max-height: 500px;">
                    <div id="iconPickerGrid" class="icon-picker-grid"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Configuración -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="settingsModalLabel"><i class="bi bi-gear"></i> Configuración</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Orientación del canvas</label>
                    <hr>
                    <h4>Canvas</h4>

                    <div class="d-flex gap-3 mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="orientationRadio" id="orientVertical"
                                value="portrait">
                            <label class="form-check-label" for="orientVertical">Vertical (A4)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="orientationRadio" id="orientHorizontal"
                                value="landscape">
                            <label class="form-check-label" for="orientHorizontal">Horizontal (A4)</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Color de fondo del canvas</label>
                        <input type="color" class="form-control form-control-color p-0" id="canvasBgColorInput"
                            value="#ffffff" style="width: 56px; height: 42px;" />
                    </div>
                    <hr>

                    <h4>Grilla</h4>
                    <div class="d-flex gap-3 mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="gridVisibleToggle" checked>
                            <label class="form-check-label" for="gridVisibleToggle">Mostrar grilla</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="snappingToggle" checked>
                            <label class="form-check-label" for="snappingToggle">Snapping</label>
                        </div>
                    </div>
                    <div class="d-flex row gap-3 mb-3">
                        <div class="mb-3 col-4">
                            <label for="cellSizeInput" class="form-label">Tamaño de celda (px)</label>
                            <input type="number" id="cellSizeInput" class="form-control" min="10" max="200" step="2">
                        </div>

                        <div class="mb-3 col">
                            <label for="gridTypeSelect" class="form-label">Tipo de grilla</label>
                            <select class="form-select" id="gridTypeSelect">
                                <option value="square">Cuadrada</option>
                                <option value="hex-flat">Hexagonal (plano)</option>
                                <option value="hex-pointy">Hexagonal (punta)</option>
                                <option value="circles">Círculos</option>
                                <option value="isometric">Isométrica</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Color de grilla</label>
                        <div class="d-flex align-items-center gap-2">
                            <input type="color" class="form-control form-control-color p-0" id="gridColorInput"
                                value="#808080" style="width: 56px; height: 42px;" />
                            <div class="flex-grow-1">
                                <label for="gridAlphaInput" class="form-label mb-1">Opacidad</label>
                                <input type="range" class="form-range" id="gridAlphaInput" min="0" max="1" step="0.01"
                                    value="0.18">
                            </div>
                            <div><span id="gridAlphaValue" class="badge bg-secondary">18%</span></div>
                        </div>
                    </div>
                    <hr>

                    <h4>Tema</h4>
                    <div class="mb-3">
                        <label class="form-label">Seleccionar tema</label>
                        <select class="form-select" id="themeSelect">
                            <option value="fantasy">Fantasy</option>
                            <option value="modern">Modern</option>
                            <option value="scifi">Sci-Fi</option>
                            <option value="underwater">Underwater</option>
                            <option value="pound_of_flesh">Mothership APOF</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Paleta de colores actual</label>
                        <div id="currentThemePalette" class="d-flex flex-wrap gap-2">
                            <!-- Palette colors will be generated by JS -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" id="applyOrientationBtn" class="btn btn-primary"
                        data-bs-dismiss="modal">Aplicar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de inicio - selección de mapa -->
    <div class="modal fade" id="startupModal" tabindex="-1" aria-labelledby="startupModalLabel" aria-hidden="true"
        data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="startupModalLabel"><i class="bi bi-compass"></i> Bienvenido a Pointcrawl
                        Studio</h5>
                </div>
                <div class="modal-body">
                    <p class="mb-3">¿Cómo te gustaría comenzar?</p>
                    <div class="d-grid gap-2">
                        <button id="loadPremadeMapBtn" class="btn btn-primary"><i
                                class="bi bi-file-earmark-arrow-down"></i> Cargar mapa predefinido</button>
                        <button id="startBlankMapBtn" class="btn btn-outline-light"><i class="bi bi-plus-square"></i>
                            Empezar con mapa vacío</button>
                        <button id="loadLastSessionBtn" class="btn btn-outline-secondary"><i
                                class="bi bi-clock-history"></i> Continuar sesión anterior</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de selección de mapas predefinidos -->
    <div class="modal fade" id="mapSelectionModal" tabindex="-1" aria-labelledby="mapSelectionModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="mapSelectionModalLabel"><i class="bi bi-map"></i> Seleccionar mapa
                        predefinido</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="mapList" class="row g-3">
                        <!-- Maps will be populated here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver</button>
                </div>
            </div>
        </div>
    </div>


    <div class="app-container">

        

        <!-- Área del canvas con scroll para pan -->
        <div class="canvas-area col-8" id="canvasContainer">
            <canvas id="pointcanvas" width="1131" height="800"></canvas>
            <div id="statusMsg" class="alert alert-secondary alert-dismissible" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1050; min-width: 300px; max-width: 500px; display: none;">
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                <div><i class="bi bi-check-circle-fill"></i> Message</div>
            </div>
            
        </div>

        <!-- Columna de propiedades de nodos -->
        <div class="properties-panel col-4" style="max-height: 800px; overflow-y: auto">
            <!-- Propiedades de nodos -->
            <div id="nodePropertiesPanel">
                <div class="section mt-3 p-2">
                    <h3>PROPIEDADES DEL NODO</h3>
                    <div class="container-fluid p-0">
                        <!-- Fila con 2 columnas -->
                        <div class="row">
                            <div class="col-2">
                                <label class="form-label"><i class="bi bi-palette-fill"></i> Color</label>
                                <input type="color" id="nodeBgColor" class="form-control form-control-color"
                                    value="#ffffff">
                            </div>
                            <div class="col">
                                <label class="form-label"><i class="bi bi-diamond-half"></i> Forma</label>
                                <select id="nodeShape" class="form-select">
                                    <option value="circle">Círculo</option>
                                    <option value="square">Cuadrado</option>
                                    <option value="hexagon">Hexágono (punta arriba)</option>
                                    <option value="hexagon-flat">Hexágono (plano arriba)</option>
                                    <option value="isometric">Isométrica</option>
                                    <option value="isometric-circle">Círculo isométrico</option>
                                    <option value="diamond">Rombo</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <div class="row"><!-- Fila con 2 columnas -->
                                    <div class="property-row">
                                        <label>Escala del nodo</label>
                                        <div class="d-flex gap-2">
                                            <input type="number" id="nodeScaleInput" class="form-control" step="0.1" min="0.2"
                                                max="3" value="1.0">
                                            <button id="resetScaleBtn" class="btn btn-outline-secondary"
                                                title="Resetear a escala 1 (tamaño de celda)">↺</button>
                                        </div>
                                    </div>
                                </div>  
                            </div>
                        </div>
                        <div>
                            <div class="accordion" id="accordionExample">
                                <div class="accordion-item">
                                    <h2 class="accordion-header">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseIcon" aria-expanded="false" aria-controls="collapseThree">
                                        Ícono
                                    </button>
                                    </h2>
                                    <div id="collapseIcon" class="accordion-collapse collapse" aria-labelledby="headingThree" style="">
                                    <div class="accordion-body">
                                        <div class="row">
                                            <div class="col-6">
                                                <label class="form-label"><i class="bi bi-palette"></i> Color del icono</label>
                                                <input type="color" id="iconColor" class="form-control form-control-color" value="#ffffff">
                                            </div>
                                            <div class="col text-center">
                                                <div class="icon-preview border rounded p-2 bg-dark" id="iconPreview">Sin icono</div>
                                            </div>
                                        </div>
                                        <!-- Fila completa - Iconos -->
                                        <div class="row mb-3">
                                            <div class="col-12">
                                                <br>
                                                <div class="row g-2">
                                                    <div class="col-6">
                                                        <input type="file" id="iconFile" class="form-control form-control-sm"
                                                            accept="image/png,image/svg+xml">
                                                    </div>
                                                    <div class="col-6">
                                                        <div class="input-group input-group-sm">
                                                            <input type="text" id="iconUrl" class="form-control" placeholder="URL...">
                                                            <button id="loadUrlIcon"
                                                                class="btn btn-outline-secondary btn-sm">Cargar</button>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="mt-2">
                                                    <button id="selectIconBtn" class="btn btn-outline-secondary btn-sm w-100">Seleccionar
                                                        icono predefinido</button>
                                                </div>
                                            </div>
                                        </div> 
                                        <div class="row mb-3">
                                            <div class="col-4">
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" type="checkbox" id="nodeIconFlipX">
                                                    <label class="form-check-label" for="nodeIconFlipX">Voltear X</label>
                                                </div>
                                            </div>
                                            <div class="col-4">
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" type="checkbox" id="nodeIconFlipY">
                                                    <label class="form-check-label" for="nodeIconFlipY">Voltear Y</label>
                                                </div>
                                            </div>
                                            <div class="col-4">
                                                <label class="form-label">Rotación</label>
                                                <input type="number" id="nodeIconRotation" class="form-control" min="0" max="360" step="1" value="0">
                                            </div>
                                        </div>
                                        <button id="removeIconBtn" class="btn btn-warning btn-sm"><i class="bi bi-trash"></i>
                                            Quitar icono</button>                                       
                                    </div>
                                    </div>
                                </div>
                                <div class="accordion-item">
                                    <h2 class="accordion-header" id="headingOne">
                                    
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                                        <i class="bi bi-tag-fill"> </i>.......Texto Exterior (tag)
                                    </button>
                                    </h2>
                                    <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" style="">
                                    <div class="accordion-body">
                                        <div class="row mb-3">
                                            <div class="col-12">
                                                <label class="form-label">Texto</label>
                                                <input type="text" id="labelText" class="form-control" placeholder="Etiqueta">
                                            </div>
                                        </div>
                                        <hr>
                                        <div class="row mb-3">
                                            <div class="col-6">
                                                <label class="form-label"><i class="bi bi-arrow-up-short"></i> Posición externo</label>
                                                <select id="labelPos" class="form-select">
                                                    <option value="top">Arriba</option>
                                                    <option value="bottom">Abajo</option>
                                                    <option value="left">Izquierda</option>
                                                    <option value="right">Derecha</option>
                                                </select>
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label"><i class="bi bi-brush"></i> Fondo texto externo</label>
                                                <input type="color" id="labelBgColor" class="form-control form-control-color"
                                                    value="#ffffff">
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-6">
                                                <label class="form-label">Rotación texto externo</label>
                                                <input type="number" id="externalLabelRotation" class="form-control" min="0" max="360" step="1" value="0">
                                            </div>
                                        </div>
                                        <!-- Font Settings for External Label -->
                                        <div class="row mb-3">
                                            <div class="col-6">
                                                <label class="form-label">Fuente</label>
                                                <select id="externalLabelFontFamily" class="form-select">
                                                    <option value="Georgia, serif">Georgia (Serif)</option>
                                                    <option value="Arial, sans-serif">Arial (Sans-serif)</option>
                                                    <option value="Courier New, monospace">Courier New (Monospace)</option>
                                                    <option value="Times New Roman, serif">Times New Roman</option>
                                                    <option value="Trebuchet MS, sans-serif">Trebuchet MS</option>
                                                    <option value="Verdana, sans-serif">Verdana</option>
                                                </select>
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label">Tamaño</label>
                                                <input type="number" id="externalLabelFontSize" class="form-control" min="8" max="48"
                                                    value="12">
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-6">
                                                <label class="form-label">Color</label>
                                                <input type="color" id="externalLabelFontColor" class="form-control form-control-color"
                                                    value="#000000">
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label">Peso</label>
                                                <select id="externalLabelFontWeight" class="form-select">
                                                    <option value="normal">Normal</option>
                                                    <option value="bold">Bold</option>
                                                    <option value="700">700 (Bold)</option>
                                                    <option value="600">600 (Semi-bold)</option>
                                                    <option value="400">400 (Regular)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    </div>
                                </div>
                                <div class="accordion-item">
                                    <h2 class="accordion-header" id="headingInteriorLabel">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseInteriorLabel" aria-expanded="false" aria-controls="collapseTwo">
                                        <i class="bi bi-type"></i>.......Texto Interior
                                    </button>
                                    </h2>
                                    <div id="collapseInteriorLabel" class="accordion-collapse collapse" aria-labelledby="collapseInteriorLabel" style="">
                                        <div class="accordion-body">
                                            <div class="row mb-3">
                                                <div class="col-12">
                                                    <label class="form-label"><i class="bi bi-fonts"></i> Texto interno</label>
                                                    <input type="text" id="innerText" class="form-control" placeholder="Ej: Torre">
                                                </div>
                                            </div>
                                            <hr>
                                            <!-- Font Settings for Internal Label -->
                                            <div class="mb-3">
                                                <label class="form-label"><i class="bi bi-type"></i> <strong>Fuente</strong></label>
                                            </div>
                                            <div class="row mb-3">
                                                <div class="col-6">
                                                    <label class="form-label">Familia</label>
                                                    <select id="innerLabelFontFamily" class="form-select">
                                                        <option value="Georgia, serif">Georgia (Serif)</option>
                                                        <option value="Arial, sans-serif">Arial (Sans-serif)</option>
                                                        <option value="Courier New, monospace">Courier New (Monospace)</option>
                                                        <option value="Times New Roman, serif">Times New Roman</option>
                                                        <option value="Trebuchet MS, sans-serif">Trebuchet MS</option>
                                                        <option value="Verdana, sans-serif">Verdana</option>
                                                    </select>
                                                </div>
                                                <div class="col-6">
                                                    <label class="form-label">Tamaño</label>
                                                    <input type="number" id="innerLabelFontSize" class="form-control" min="8" max="48"
                                                        value="14">
                                                </div>
                                            </div>
                                            <div class="row mb-3">
                                                <div class="col-6">
                                                    <label class="form-label">Color</label>
                                                    <input type="color" id="innerLabelFontColor" class="form-control form-control-color"
                                                        value="#000000">
                                                </div>
                                                <div class="col-6">
                                                    <label class="form-label">Peso</label>
                                                    <select id="innerLabelFontWeight" class="form-select">
                                                        <option value="normal">Normal</option>
                                                        <option value="bold">Bold</option>
                                                        <option value="700">700 (Bold)</option>
                                                        <option value="600">600 (Semi-bold)</option>
                                                        <option value="400">400 (Regular)</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="row mb-3">
                                                <div class="col-6">
                                                    <label class="form-label">Rotación texto interno</label>
                                                    <input type="number" id="innerLabelRotation" class="form-control" min="0" max="360" step="1" value="0">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="accordion-item">
                                    <h2 class="accordion-header" id="headingThree">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                        Otros efectos
                                    </button>
                                    </h2>
                                    <div id="collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree" style="">
                                    <div class="accordion-body">
                                        <!-- Glow Settings -->
                                        <div class="col mb-3">
                                            <label class="form-label"><i class="bi bi-brightness-high"></i> <strong>Efecto Brillo (Glow)</strong></label>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-3">
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" type="checkbox" id="nodeGlowEnabled" value="">
                                                    <label class="form-check-label" for="nodeGlowEnabled">Activar</label>
                                                </div>
                                            </div>
                                            <div class="col-3">
                                                <label class="form-label">Color del brillo</label>
                                                <input type="color" id="nodeGlowColor" class="form-control form-control-color"
                                                    value="#ffff00">
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label">Tamaño</label>
                                                <input type="range" id="nodeGlowSize" class="form-range" min="2" max="30" step="1"
                                                    value="10">
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-3">
                                                <label class="form-label"><i class="bi bi-border-all"></i> Color de borde</label>
                                                <input type="color" id="nodeBorderColor" class="form-control form-control-color"
                                                    value="#000000">
                                            </div>
                                            <div class="col-3">
                                                <label class="form-label">Grosor de borde</label>
                                                <input type="number" id="nodeBorderWidth" class="form-control" min="0" max="20" step="1" value="0">
                                            </div>
                                        </div>
                                        
                                        <hr>
                                    </div>
                                    </div>
                                </div>
                                
                                </div>
                        </div>

                    </div>
                    <br>
                    

                    <!-- Fila completa - Botones -->
                    <div class="row">
                        <div class="col-12">
                            <div class="d-grid gap-2">
                                <button id="duplicateNodeBtn" class="btn btn-primary btn"><i class="bi bi-copy"></i>
                                    Duplicar</button>
                                <button id="deleteNodeBtn" class="btn btn-danger btn"><i class="bi bi-x-circle"></i>
                                    Eliminar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Propiedades de conexiones -->
            <div id="connectionPropertiesPanel">
                <div class="section">
                    <h3><i class="bi bi-link-45deg"></i> PROPIEDADES DE CONEXIÓN</h3>
                    <div class="container-fluid p-1">
                        <div class="row mb-1">
                            <div class="col-3">
                                <label class="form-label"><i class="bi bi-pip"></i> Color línea</label>
                                <input type="color" id="lineColor" class="form-control form-control-color"
                                    value="#000000">
                            </div>
                            <div class="col-3">
                                <label class="form-label"><i class="bi bi-droplet-half"></i> Opacidad</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="range" id="connOpacitySlider" min="0" max="100" step="1" value="100"
                                        class="form-range">
                                    <span id="opacityValue" class="slider-value badge bg-secondary">100%</span>
                                </div>
                            </div>
                            <div class="col-4">
                                <label class="form-label"><i class="bi bi-dash-lg"></i> Grosor</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="range" id="lineWidthSlider" min="1" max="5" step="1" value="2"
                                        class="form-range">
                                    <span id="widthValue" class="slider-value badge bg-secondary">Media</span>
                                </div>
                            </div>
                            <div class="col-4">
                                <label class="form-label"><i class="bi bi-bezier2"></i> Tipo de línea</label>
                                <select id="strokePattern" class="form-select">
                                    <option value="normal">Normal</option>
                                    <option value="rayada">Rayada</option>
                                    <option value="dotted">Punteada</option>
                                    <option value="wavy_wide">Ondulada (amplia)</option>
                                    <option value="wavy_short">Ondulada (ondas cortas)</option>
                                    <option value="zigzag">Zigzag</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label class="form-label">Inicio / Fin - Capas</label>
                                <div class="d-flex gap-2">
                                    <select id="connStartCap" class="form-select">
                                        <option value="none">Ninguno</option>
                                        <option value="arrow">Flecha</option>
                                        <option value="inverted">Flecha invertida</option>
                                        <option value="square">Cuadrado</option>
                                        <option value="cross">Cruz</option>
                                        <option value="line">Línea</option>
                                    </select>
                                    <select id="connEndCap" class="form-select">
                                        <option value="none">Ninguno</option>
                                        <option value="arrow">Flecha</option>
                                        <option value="inverted">Flecha invertida</option>
                                        <option value="square">Cuadrado</option>
                                        <option value="cross">Cruz</option>
                                        <option value="line">Línea</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <hr>
                                                                    <div class="col-12 mb-2">
                                                <label class="form-label"><i class="bi bi-chat-text-fill"></i> Texto</label>
                                                <input type="text" id="connText" class="form-control" placeholder="Ej: 2 días">
                                            </div>
                        <div class="row mb-2">
                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="connLabelParallel">
                                    <label class="form-check-label" for="connLabelParallel">Texto paralelo a la línea</label>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-2" id="labelSideOffsetControls" style="display: none;">
                            <div class="col-6">
                                <label class="form-label">Lado</label>
                                <select id="connLabelSide" class="form-select">
                                    <option value="above">Arriba</option>
                                    <option value="below">Abajo</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Distancia</label>
                                <input type="number" id="connLabelOffset" class="form-control" min="5" max="50" value="15" step="1">
                            </div>
                        </div>
                        <div class="row mb-2">

                        </div>
                        <div class="form-check form-switch col-12">
                            <input class="form-check-input" type="checkbox" data-bs-toggle="collapse" data-bs-target="#connectionTextCollapse" id="connectionTextEnabled" value="">
                            <label class="form-check-label" for="connectionTextEnabled">Avanzado</label>
                        </div>
                        <div class="col">
                            <div class="row">
                                <div class="collapse multi-collapse" id="connectionTextCollapse">
                                    <div class="card card-body">

                                        <!-- Font Settings for Connection Label -->

                                        <div class="row mb-3">
                                            <div class="col-6">
                                                <label class="form-label">Fuente</label>
                                                <select id="connLabelFontFamily" class="form-select">
                                                    <option value="Georgia, serif">Georgia (Serif)</option>
                                                    <option value="Arial, sans-serif">Arial (Sans-serif)</option>
                                                    <option value="Courier New, monospace">Courier New (Monospace)</option>
                                                    <option value="Times New Roman, serif">Times New Roman</option>
                                                    <option value="Trebuchet MS, sans-serif">Trebuchet MS</option>
                                                    <option value="Verdana, sans-serif">Verdana</option>
                                                </select>
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label">Tamaño</label>
                                                <input type="number" id="connLabelFontSize" class="form-control" min="8" max="48"
                                                    value="11">
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-3">
                                                <label class="form-label">Color de Fuente</label>
                                                <input type="color" id="connLabelFontColor" class="form-control form-control-color"
                                                    value="#000000">
                                            </div>
                                            <div class="col-3">
                                                <label class="form-label"> Color de Fondo</label>
                                                <input type="color" id="connLabelBgColor" class="form-control form-control-color"
                                                    value="#000000">
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label">Peso</label>
                                                <select id="connLabelFontWeight" class="form-select">
                                                    <option value="normal">Normal</option>
                                                    <option value="bold">Bold</option>
                                                    <option value="700">700 (Bold)</option>
                                                    <option value="600">600 (Semi-bold)</option>
                                                    <option value="400">400 (Regular)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <hr>

                                                <div class="row mb-3">
                            <div class="col-12">
                                <label class="form-label"><i class="bi bi-palette"></i> Patrón decorativo</label>
                                <select id="connPattern" class="form-select">
                                    <option value="none">Ninguno</option>
                                    <option value="arrows">Flechas</option>
                                    <option value="dots">Puntos</option>
                                    <option value="squares">Cuadrados</option>
                                    <option value="lines">Líneas cruzadas</option>
                                </select>
                            </div>
                        </div>
                                                <div class="form-check form-switch col-12">
                            <i class="bi bi-chat-emoji-sunglasses"></i>
                            <input class="form-check-input" type="checkbox" data-bs-toggle="collapse" data-bs-target="#decorationCollapse" id="decoEnabled" value="">
                            <label class="form-check-label" for="decoEnabled">Valores</label>
                        </div>
                        <div class="row">
                            <div class="collapse multi-collapse" id="decorationCollapse">
                                <div class="card card-body">
                                    

                        <!-- Fila completa - Cantidad de patrones -->
                        <div class="row mb-3">
                            <div class="col-12">
                                <label class="form-label"><i class="bi bi-list-ol"></i> Cantidad de patrones</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="range" id="patternCount" min="0" max="31" step="1" value="0"
                                        class="form-range">
                                    <span id="patternCountValue" class="pattern-count-value badge bg-secondary">0</span>
                                </div>
                            </div>
                        </div>

                        <!-- Fila completa - Tamaño del patrón -->
                        <div class="row mb-3">
                            <div class="col-12">
                                <label class="form-label"><i class="bi bi-arrows-expand"></i> Tamaño del patrón</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="range" id="patternSize" min="1.2" max="5" step="0.1" value="1.5"
                                        class="form-range">
                                    <span id="patternSizeValue"
                                        class="pattern-size-value badge bg-secondary">1.50</span>
                                </div>
                            </div>
                        </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        

                        <!-- Fila completa - Icono de conexión -->
                        <div class="row mb-3">
                            <div class="col-12">
                                <label class="form-label"><i class="bi bi-emoji-sunglasses"></i> Icono en medio</label>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <input type="file" id="connIconFile" class="form-control form-control-sm"
                                            accept="image/png,image/svg+xml">
                                    </div>
                                    <div class="col-6">
                                        <div class="input-group input-group-sm">
                                            <input type="text" id="connIconUrl" class="form-control"
                                                placeholder="URL...">
                                            <button id="loadConnIconUrl"
                                                class="btn btn-outline-secondary btn-sm">Cargar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Fila con 2 columnas - Forma del icono -->
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Forma del ícono</label>
                                <select id="connIconShape" class="form-select">
                                    <option value="circle">Círculo</option>
                                    <option value="square">Cuadrado</option>
                                    <option value="diamond">Rombo</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Relleno de forma</label>
                                <input type="color" id="connIconFill" class="form-control form-control-color"
                                    value="#ffffff">
                            </div>
                        </div>

                        <!-- Fila completa - Preview del icono -->
                        <div class="row mb-3">
                            <div class="col-12 text-center">
                                <div class="icon-preview border rounded p-2 bg-light" id="connIconPreview">Sin ícono
                                </div>
                            </div>
                        </div>

                        

                        <!-- Fila completa - Botones -->
                        <div class="row">
                            <div class="col-12">
                                <div class="d-grid gap-2">
                                    <button id="removeConnIconBtn" class="btn btn-warning btn-sm"><i
                                            class="bi bi-trash"></i> Quitar ícono</button>
                                    <button id="deleteConnBtn" class="btn btn-danger btn-sm"><i
                                            class="bi bi-link-slash"></i> Eliminar conexión</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>





    </div>
